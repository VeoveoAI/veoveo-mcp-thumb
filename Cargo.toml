[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-mcp-thumb"
publish = false

[workspace.dependencies]
tempfile = "=3.27.0"
# veoveo-core, pinned to one revision for every core crate.
veoveo-skills = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "c8f16d85a3f15a865960a56b8a7d9ac68ca37088" }
veoveo-types = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "c8f16d85a3f15a865960a56b8a7d9ac68ca37088" }
# The Rust SDK for Veoveo MCP servers: the contract feature for declarations, the server
# feature for hosting, registration and the forwarded identity.
veoveo-hub-sdk = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "80dc604e9374471f8a40771668c1cb41ecb56f22", default-features = false }
# Artifact's client, which reads an artifact's bytes. It pins this SDK revision, so the two move together.
veoveo-mcp-artifact = { git = "https://github.com/VeoveoAI/veoveo-mcp-artifact", rev = "3f264d0aad2cdde70065ec2dcb3b8b51720d9ad2", default-features = false }
# USD's contract, for its pictures of stages. The same.
veoveo-mcp-usd = { git = "https://github.com/VeoveoAI/veoveo-mcp-usd", rev = "ccffe9af115f46922d90ccfe343ecb77ee4d428a", default-features = false }

anyhow = "=1.0.104"
axum = { version = "0.8.9", default-features = false }
base64 = "=0.22.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures = "0.3.34"
# A renderer's narrower sandbox.
landlock = "=0.4.7"
# The SDK's HTTP client release; registration and the tests share it.
reqwest = { version = "=0.13.5", default-features = false }
# The rmcp fork the SDK pins; the tool router uses its macros.
rmcp = { version = "=3.11.0", git = "https://github.com/VeoveoAI/rust-sdk", rev = "1e7caf018db7eb3bed2e81023e10fc0ce58af8a5" }
rustix = { version = "=1.1.6", features = ["process"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
sha2 = "=0.10.9"
tracing = "0.1.44"
tower = "0.5.3"
url = "=2.5.9"

schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = "1.53.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
