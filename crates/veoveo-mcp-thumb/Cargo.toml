[package]
name = "veoveo-mcp-thumb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# The server's public types: checked names, resource addresses, tool requests and results
# and the permission vocabulary. No runtime dependency.
contract = [
    "dep:schemars",
    "dep:serde",
    "dep:thiserror",
    "dep:veoveo-hub-sdk",
    "dep:veoveo-types",
]
# The hosted server: MCP through the SDK, reads through the Hub, the renderers and the binary.
server = [
    "contract",
    "veoveo-hub-sdk/server",
    "dep:anyhow",
    "dep:axum",
    "dep:base64",
    "dep:clap",
    "dep:dotenvy",
    "dep:futures",
    "dep:landlock",
    "dep:reqwest",
    "dep:rmcp",
    "dep:rustix",
    "dep:rustls",
    "dep:secrecy",
    "dep:serde_json",
    "dep:sha2",
    "dep:tempfile",
    "dep:tokio",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/signal",
    "tokio/process",
    "tokio/fs",
    "tokio/io-util",
    "dep:tracing",
    "dep:url",
    "dep:veoveo-mcp-artifact",
    "veoveo-mcp-artifact/client",
    "dep:veoveo-mcp-usd",
    "veoveo-mcp-usd/contract",
    "dep:veoveo-skills",
]

[build-dependencies]
# Embeds the skills under skills/ at build time.
veoveo-skills = { workspace = true, features = ["build"] }

[dependencies]
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
veoveo-hub-sdk = { workspace = true, features = ["contract"], optional = true }
veoveo-types = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
axum = { workspace = true, features = ["http1", "tokio"], optional = true }
base64 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls-no-provider", "stream"], optional = true }
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-streamable-http-server"], optional = true }
rustix = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "net"] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
veoveo-mcp-artifact = { workspace = true, optional = true }
veoveo-mcp-usd = { workspace = true, optional = true }
veoveo-skills = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true, optional = true }

[dev-dependencies]
rmcp.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tower.workspace = true
veoveo-hub-sdk = { workspace = true, features = ["server", "testing"] }

[[bin]]
name = "veoveo-mcp-thumb"
required-features = ["server"]

[[test]]
name = "mcp"
required-features = ["server"]

[[test]]
name = "confine"
required-features = ["server"]
