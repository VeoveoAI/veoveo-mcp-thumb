<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Files</title>
<style>
:root {
  --bg: var(--color-background-primary, #ffffff);
  --soft: var(--color-background-secondary, #f3f4f6);
  --fg: var(--color-text-primary, #16181d);
  --muted: var(--color-text-secondary, #5b616e);
  --line: var(--color-border-primary, #e1e4e9);
  --accent: var(--color-text-info, #2557d6);
  --danger: var(--color-text-danger, #b42318);
  --radius: var(--border-radius-md, 10px);
  --sans: var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: var(--color-background-primary, #14161a);
  --soft: var(--color-background-secondary, #1e2127);
  --fg: var(--color-text-primary, #e8eaee);
  --muted: var(--color-text-secondary, #9aa1ad);
  --line: var(--color-border-primary, #2c3038);
  --accent: var(--color-text-info, #7aa2ff);
  --danger: var(--color-text-danger, #ff8a80);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
button, input { font: inherit; color: inherit; }
main { padding: 16px; display: grid; gap: 14px; max-width: 1680px; margin: 0 auto; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-right: auto; min-width: 0; font-size: 16px; font-weight: 600; }
.crumbs button { background: none; border: 0; padding: 3px 6px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; max-width: 26ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs button:hover { background: var(--soft); color: var(--fg); }
.crumbs .here { padding: 3px 6px; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs .sep { color: var(--muted); opacity: .6; }
.search { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 6px 10px; width: 200px; max-width: 100%; }
.search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.switch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.switch button { background: none; border: 0; padding: 5px 8px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.switch button[aria-pressed="true"] { background: var(--soft); color: var(--fg); }
.switch svg { width: 16px; height: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 11px; cursor: pointer; color: var(--muted); font-size: 13px; }
.chips button:hover { color: var(--fg); }
.chips button[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 18px 14px; }
.card { display: grid; gap: 7px; align-content: start; width: 100%; padding: 0; background: none; border: 0; text-align: left; cursor: pointer; min-width: 0; }
.card:disabled { cursor: default; opacity: .7; }
.thumb { position: relative; aspect-ratio: 4 / 3; border-radius: var(--radius); background: var(--soft); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; transition: border-color .12s, box-shadow .12s, transform .12s; }
.card:not(:disabled):hover .thumb { border-color: var(--accent); box-shadow: 0 6px 18px rgb(0 0 0 / .12); transform: translateY(-1px); }
.card:focus-visible { outline: none; }
.card:focus-visible .thumb { outline: 2px solid var(--accent); outline-offset: 2px; }
.thumb .icon { width: 44px; height: 44px; color: var(--muted); opacity: .75; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .2s; }
.thumb img.ready { opacity: 1; }
.card[data-kind="image"] .thumb img, .card[data-kind="video"] .thumb img, .card[data-kind="scene"] .thumb img { object-fit: cover; }
.card[data-kind="document"] .thumb { background: color-mix(in srgb, var(--soft) 70%, var(--fg) 8%); }
.card[data-kind="document"] .thumb img { padding: 8px; filter: drop-shadow(0 1px 3px rgb(0 0 0 / .25)); }
.thumb.has-picture .icon { visibility: hidden; }
.thumb.drawing::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgb(255 255 255 / .16) 50%, transparent 70%); background-size: 220% 100%; animation: sweep 1.3s linear infinite; }
@keyframes sweep { from { background-position: 180% 0; } to { background-position: -60% 0; } }
.mosaic { position: absolute; inset: 0; display: grid; gap: 2px; background: var(--line); }
.mosaic[data-count="2"] { grid-template-columns: 1fr 1fr; }
.mosaic[data-count="3"], .mosaic[data-count="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.mosaic[data-count="3"] > :first-child { grid-row: span 2; }
.mosaic span { position: relative; background: var(--soft); min-width: 0; min-height: 0; overflow: hidden; }
.mosaic img { object-fit: cover; opacity: 1; }
.badge { position: absolute; left: 7px; bottom: 7px; display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 5px; font-size: 11px; font-weight: 600; letter-spacing: .02em; color: #fff; background: rgb(15 18 24 / .72); z-index: 1; }
.name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.about { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -5px; }

.grid.rows { grid-template-columns: minmax(0, 1fr); gap: 2px; }
.grid.rows .card { grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 5px 8px; border-radius: 8px; }
.grid.rows .card:not(:disabled):hover { background: var(--soft); }
.grid.rows .thumb { aspect-ratio: 4 / 3; border-radius: 6px; }
.grid.rows .card:not(:disabled):hover .thumb { transform: none; box-shadow: none; }
.grid.rows .thumb .icon { width: 22px; height: 22px; }
.grid.rows .badge { display: none; }
.grid.rows .about { margin: 0; }

.skeleton { pointer-events: none; }
.skeleton .thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgb(255 255 255 / .14) 50%, transparent 70%); background-size: 220% 100%; animation: sweep 1.3s linear infinite; }
.skeleton .line { height: 11px; width: 70%; background: var(--soft); border-radius: 4px; }
.note { padding: 32px 16px; text-align: center; color: var(--muted); }
.problem { padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--danger) 40%, var(--line)); border-radius: 8px; color: var(--danger); display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.problem button { border: 1px solid currentColor; background: none; border-radius: 6px; padding: 3px 10px; cursor: pointer; color: inherit; }

dialog { border: 0; padding: 0; background: #0d0f13; color: #eef0f3; width: min(1200px, calc(100vw - 32px)); max-height: calc(100vh - 32px); border-radius: 14px; overflow: hidden; box-shadow: 0 20px 70px rgb(0 0 0 / .5); }
dialog::backdrop { background: rgb(8 9 12 / .72); }
dialog[open] { display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.stage { position: relative; min-height: 240px; height: min(72vh, 760px); display: grid; place-items: center; background: #15181e; overflow: hidden; }
.stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; width: 100%; height: 100%; }
.stage .icon { width: 72px; height: 72px; opacity: .6; }
.stage .say { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; color: #aab0ba; font-size: 13px; }
.stage.drawing::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, #7aa2ff, transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { background-position: -40% 0; } to { background-position: 140% 0; } }
.step { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgb(255 255 255 / .1); color: #fff; font-size: 20px; line-height: 1; cursor: pointer; }
.step:hover { background: rgb(255 255 255 / .22); }
.step:disabled { opacity: .25; cursor: default; }
#previous { left: 12px; } #next { right: 12px; }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px; }
.facts .what { min-width: 0; flex: 1 1 260px; }
.facts .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facts .detail { color: #aab0ba; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facts button { border-radius: 8px; padding: 6px 14px; cursor: pointer; border: 1px solid #3a3f49; background: none; color: inherit; }
.facts button:hover { background: rgb(255 255 255 / .08); }
.facts #open { background: #eef0f3; border-color: #eef0f3; color: #0d0f13; font-weight: 600; }
.facts #open:hover { background: #fff; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main>
  <div class="bar">
    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
    <input class="search" id="search" type="search" placeholder="Filter by name" aria-label="Filter by name">
    <div class="switch" role="group" aria-label="How to show them">
      <button id="as-grid" type="button" aria-pressed="true" aria-label="Pictures" title="Pictures"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button>
      <button id="as-rows" type="button" aria-pressed="false" aria-label="List" title="List"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="2" width="14" height="2.4" rx="1"/><rect x="1" y="6.8" width="14" height="2.4" rx="1"/><rect x="1" y="11.6" width="14" height="2.4" rx="1"/></svg></button>
    </div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Show only" hidden></div>
  <div class="problem" id="problem" hidden><span id="problem-text"></span><button id="again" type="button">Try again</button></div>
  <div class="grid" id="grid"></div>
  <div class="note" id="note" hidden></div>
</main>
<dialog id="look" aria-labelledby="look-title">
  <div class="stage" id="stage">
    <span id="stage-icon"></span>
    <img id="stage-image" alt="" hidden>
    <div class="say" id="stage-say" hidden></div>
    <button class="step" id="previous" type="button" aria-label="Previous">&#8249;</button>
    <button class="step" id="next" type="button" aria-label="Next">&#8250;</button>
  </div>
  <div class="facts">
    <div class="what"><div class="title" id="look-title"></div><div class="detail" id="look-detail"></div></div>
    <button id="close" type="button">Close</button>
    <button id="open" type="button">Open</button>
  </div>
</dialog>
<script>
"use strict";
// The gallery of Lore repositories: a folder from this server, each file's picture from this server
// as the person, and a file opening through the Hub's /view/ page, which frames it on the content
// domain. Every name here is a stranger's text, so it only ever reaches the page as text.
(() => {
  const PROTOCOL = "2026-01-26";
  const TIMEOUT = 30000;
  const PICTURE_TIMEOUT = 200000;
  const AT_ONCE = 6;
  const $ = (id) => document.getElementById(id);

  // The bridge to the host.
  const pending = new Map();
  let nextId = 1;
  const post = (message) => window.parent.postMessage(message, "*");
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params });
  const request = (method, params, timeout = TIMEOUT) => new Promise((resolve, reject) => {
    const id = nextId++;
    const timer = setTimeout(() => {
      pending.delete(id);
      reject(new Error(`the host did not answer ${method}`));
    }, timeout);
    pending.set(id, { resolve, reject, timer });
    post({ jsonrpc: "2.0", id, method, params });
  });
  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || typeof message !== "object" || message.jsonrpc !== "2.0") return;
    if (typeof message.method === "string") {
      if (message.method === "ui/notifications/host-context-changed") applyContext(message.params);
      if (message.id !== undefined && message.id !== null) post({ jsonrpc: "2.0", id: message.id, result: {} });
      return;
    }
    const call = pending.get(message.id);
    if (!call) return;
    pending.delete(message.id);
    clearTimeout(call.timer);
    if (message.error) call.reject(new Error(message.error.message || "the request failed"));
    else call.resolve(message.result);
  });
  const applyContext = (context) => {
    if (context && (context.theme === "dark" || context.theme === "light")) document.documentElement.dataset.theme = context.theme;
  };
  const tool = async (name, args, timeout) => {
    const reply = await request("tools/call", { name, arguments: args }, timeout);
    if (reply.isError) throw new Error((reply.content || []).map((part) => part.text || "").join(" ") || `${name} failed`);
    return reply.structuredContent;
  };

  // Facts.
  const ICONS = {
    repository: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H19v-5"/>',
    directory: '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H10l2 2.5h7.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5-8 9"/>',
    video: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/>',
    audio: '<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
    document: '<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
    model: '<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/>',
    scene: '<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/>',
    other: '<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/>',
  };
  const icon = (kind) => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[kind] || ICONS.other}</svg>`;
  const LABELS = { image: "Image", video: "Video", audio: "Audio", document: "Document", model: "3D", scene: "USD", other: "File" };
  const FILTERS = [["all", "All"], ["image", "Images"], ["video", "Video"], ["model", "3D"], ["document", "Documents"], ["audio", "Audio"], ["other", "Other"]];
  const filterOf = (entry) => entry.kind === "scene" ? "model" : (entry.kind || "folder");
  const size = (bytes) => {
    if (typeof bytes !== "number") return "";
    const units = ["B", "KB", "MB", "GB", "TB"];
    let value = bytes;
    let unit = 0;
    while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit += 1; }
    return `${unit === 0 ? value : value.toFixed(value < 10 ? 1 : 0)} ${units[unit]}`;
  };
  const extension = (name) => {
    const dot = name.lastIndexOf(".");
    return dot > 0 ? name.slice(dot + 1).toUpperCase() : "";
  };

  // What is showing.
  let at = { repository: null, branch: "main", folders: [] };
  let entries = [];
  let shown = [];
  let filter = "all";
  let generation = 0;

  const pathOf = (name) => [...at.folders, name].join("/");
  const viewUrl = (repository, branch, path) =>
    `/${["view", "lore", repository, branch, ...path.split("/")].map(encodeURIComponent).join("/")}`;

  // Pictures: only for what is on screen, at most AT_ONCE at a time, the newest asked first.
  const pictures = new Map();
  const waiting = [];
  let running = 0;
  const pump = () => {
    while (running < AT_ONCE && waiting.length) {
      const job = waiting.pop();
      if (job.generation !== generation && !job.always) continue;
      running += 1;
      job.run().catch(() => {}).finally(() => { running -= 1; pump(); });
    }
  };
  const picture = async (repository, branch, path, wanted = "small") => {
    const key = `${wanted}\0${repository}\0${branch}\0${path}`;
    if (pictures.has(key)) return pictures.get(key);
    const answer = await tool("thumbnail", { source: { from: "lore", repository, branch, path }, size: wanted }, PICTURE_TIMEOUT);
    const url = answer.data && /^image\//.test(answer.mediaType || "") ? `data:${answer.mediaType};base64,${answer.data}` : null;
    pictures.set(key, url);
    return url;
  };
  const queuePicture = (run) => { waiting.push({ generation, run }); pump(); };
  const watcher = new IntersectionObserver((seen) => {
    for (const { isIntersecting, target } of seen) {
      if (!isIntersecting) continue;
      watcher.unobserve(target);
      target._onScreen?.();
    }
  }, { rootMargin: "240px" });

  const place = (holder, url) => {
    const image = new Image();
    image.alt = "";
    image.decoding = "async";
    image.addEventListener("load", () => image.classList.add("ready"), { once: true });
    image.src = url;
    holder.append(image);
    return image;
  };

  /** The pictures of what a folder holds, four at most, for its card. */
  const coverOf = async (repository, branch, folder) => {
    const listed = async (path) => (await tool("list_files", path ? { repository, branch, path } : { repository, branch })).entries || [];
    const rank = { image: 0, video: 0, scene: 0, model: 1, document: 2, audio: 3 };
    const usable = (found, prefix) => found
      .filter((entry) => entry.type === "file" && entry.kind in rank)
      .sort((a, b) => rank[a.kind] - rank[b.kind])
      .map((entry) => (prefix ? `${prefix}/${entry.name}` : entry.name));
    const top = await listed(folder);
    let paths = usable(top, folder);
    if (paths.length < 4) {
      const inner = top.filter((entry) => entry.type === "directory").slice(0, 6);
      for (const directory of inner) {
        const path = folder ? `${folder}/${directory.name}` : directory.name;
        const first = usable(await listed(path), path)[0];
        if (first) paths.push(first);
        if (paths.length >= 4) break;
      }
    }
    return paths.slice(0, 4);
  };

  const fillCover = (thumb, repository, branch, folder) => {
    queuePicture(async () => {
      const paths = await coverOf(repository, branch, folder);
      if (!paths.length) return;
      const urls = [];
      await Promise.all(paths.map((path, index) => new Promise((done) => {
        queuePicture(async () => {
          try { urls[index] = await picture(repository, branch, path); } finally { done(); }
        });
      })));
      const found = urls.filter(Boolean);
      if (!found.length) return;
      const mosaic = document.createElement("div");
      mosaic.className = "mosaic";
      mosaic.dataset.count = String(found.length);
      for (const url of found) {
        const cell = document.createElement("span");
        place(cell, url);
        mosaic.append(cell);
      }
      thumb.append(mosaic);
      thumb.classList.add("has-picture");
    });
  };

  // Cards.
  const card = ({ name, about, kind, badge, onClick, disabled }) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "card";
    button.dataset.kind = kind;
    button.disabled = Boolean(disabled);
    const thumb = document.createElement("span");
    thumb.className = "thumb";
    thumb.innerHTML = icon(kind);
    if (badge) {
      const mark = document.createElement("span");
      mark.className = "badge";
      mark.textContent = badge;
      thumb.append(mark);
    }
    const title = document.createElement("span");
    title.className = "name";
    title.textContent = name;
    title.title = name;
    const facts = document.createElement("span");
    facts.className = "about";
    facts.textContent = about || " ";
    button.append(thumb, title, facts);
    if (!disabled) button.addEventListener("click", onClick);
    button._thumb = thumb;
    return button;
  };

  const fileCard = (entry, index) => {
    const path = pathOf(entry.name);
    const button = card({
      name: entry.name,
      about: [size(entry.size), LABELS[entry.kind]].filter(Boolean).join(" · "),
      kind: entry.kind || "other",
      badge: extension(entry.name),
      onClick: () => look(index),
    });
    const repository = at.repository.id;
    const branch = at.branch;
    button._onScreen = () => {
      const thumb = button._thumb;
      thumb.classList.add("drawing");
      queuePicture(async () => {
        try {
          const url = await picture(repository, branch, path);
          if (url) {
            place(thumb, url);
            thumb.classList.add("has-picture");
          }
        } finally {
          thumb.classList.remove("drawing");
        }
      });
    };
    watcher.observe(button);
    return button;
  };

  const folderCard = (entry) => {
    const path = pathOf(entry.name);
    const button = card({
      name: entry.name,
      about: size(entry.size) || "Folder",
      kind: "directory",
      onClick: () => go({ ...at, folders: [...at.folders, entry.name] }),
    });
    const repository = at.repository.id;
    const branch = at.branch;
    button._onScreen = () => fillCover(button._thumb, repository, branch, path);
    watcher.observe(button);
    return button;
  };

  const repositoryCard = (repository) => {
    const button = card({
      name: repository.name,
      about: "Repository",
      kind: "repository",
      onClick: () => go({ repository, branch: "main", folders: [] }),
    });
    button._onScreen = () => fillCover(button._thumb, repository.id, "main", "");
    watcher.observe(button);
    return button;
  };

  // Drawing the page.
  const crumbs = () => {
    const holder = $("crumbs");
    holder.replaceChildren();
    const step = (label, target) => {
      if (holder.children.length) {
        const sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = "/";
        holder.append(sep);
      }
      if (target) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.title = label;
        button.addEventListener("click", () => go(target));
        holder.append(button);
      } else {
        const here = document.createElement("span");
        here.className = "here";
        here.textContent = label;
        here.setAttribute("aria-current", "location");
        holder.append(here);
      }
    };
    if (!at.repository) { step("Repositories"); return; }
    step("Repositories", { repository: null, branch: "main", folders: [] });
    step(at.repository.name, at.folders.length ? { ...at, folders: [] } : null);
    at.folders.forEach((folder, index) => {
      step(folder, index < at.folders.length - 1 ? { ...at, folders: at.folders.slice(0, index + 1) } : null);
    });
  };

  const chips = () => {
    const holder = $("chips");
    holder.replaceChildren();
    const present = new Set(entries.filter((entry) => entry.type === "file").map(filterOf));
    const offered = FILTERS.filter(([key]) => key === "all" || present.has(key));
    holder.hidden = !at.repository || offered.length < 3;
    if (!offered.some(([key]) => key === filter)) filter = "all";
    for (const [key, label] of offered) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.setAttribute("aria-pressed", String(key === filter));
      button.addEventListener("click", () => { filter = key; chips(); draw(); });
      holder.append(button);
    }
  };

  const draw = () => {
    generation += 1;
    const wanted = $("search").value.trim().toLowerCase();
    const named = (entry) => !wanted || entry.name.toLowerCase().includes(wanted);
    const grid = $("grid");
    grid.replaceChildren();
    if (!at.repository) {
      const found = entries.filter(named);
      grid.append(...found.map(repositoryCard));
      showNote(found.length ? "" : entries.length ? "No repository has that name." : "You can read no repositories yet.");
      shown = [];
      return;
    }
    const folders = filter === "all" ? entries.filter((entry) => entry.type === "directory" && named(entry)) : [];
    const others = filter === "all" ? entries.filter((entry) => entry.type === "link" && named(entry)) : [];
    shown = entries.filter((entry) => entry.type === "file" && named(entry) && (filter === "all" || filterOf(entry) === filter));
    grid.append(...folders.map(folderCard));
    grid.append(...others.map((entry) => card({ name: entry.name, about: "Linked repository", kind: "link", disabled: true })));
    grid.append(...shown.map(fileCard));
    showNote(folders.length + others.length + shown.length ? "" : entries.length ? "Nothing here matches." : "This folder is empty.");
  };

  const showNote = (text) => { $("note").textContent = text; $("note").hidden = !text; };
  const showProblem = (text) => { $("problem-text").textContent = text; $("problem").hidden = !text; };

  const skeleton = (count) => {
    const grid = $("grid");
    grid.replaceChildren();
    for (let index = 0; index < count; index += 1) {
      const holder = document.createElement("div");
      holder.className = "card skeleton";
      holder.innerHTML = '<span class="thumb"></span><span class="line"></span>';
      grid.append(holder);
    }
  };

  const go = async (target) => {
    at = target;
    filter = "all";
    $("search").value = "";
    crumbs();
    showProblem("");
    showNote("");
    $("chips").hidden = true;
    skeleton(at.repository ? 8 : 6);
    const mine = ++generation;
    try {
      if (!at.repository) {
        const listing = await tool("list_files", {});
        if (mine !== generation) return;
        entries = (listing.repositories || []).map((repository) => ({ ...repository }));
      } else {
        const args = { repository: at.repository.id, branch: at.branch };
        if (at.folders.length) args.path = at.folders.join("/");
        const listing = await tool("list_files", args);
        if (mine !== generation) return;
        entries = listing.entries || [];
      }
      chips();
      draw();
    } catch (error) {
      if (mine !== generation) return;
      $("grid").replaceChildren();
      entries = [];
      showProblem(`This could not be read: ${error.message}`);
    }
  };

  // A closer look.
  let looking = -1;
  let lookTurn = 0;
  const look = async (index) => {
    const entry = shown[index];
    if (!entry) return;
    looking = index;
    const turn = ++lookTurn;
    const repository = at.repository.id;
    const branch = at.branch;
    const path = pathOf(entry.name);
    $("look-title").textContent = entry.name;
    $("look-detail").textContent = [LABELS[entry.kind], size(entry.size), `${at.repository.name}/${path}`].filter(Boolean).join(" · ");
    $("previous").disabled = index === 0;
    $("next").disabled = index === shown.length - 1;
    const image = $("stage-image");
    const small = pictures.get(`small\0${repository}\0${branch}\0${path}`);
    image.hidden = !small;
    if (small) image.src = small;
    $("stage-icon").innerHTML = small ? "" : icon(entry.kind);
    $("stage-say").hidden = true;
    $("stage").classList.add("drawing");
    if (!$("look").open) $("look").showModal();
    try {
      const url = await picture(repository, branch, path, "large");
      if (turn !== lookTurn) return;
      if (url) {
        image.src = url;
        image.hidden = false;
        $("stage-icon").innerHTML = "";
      } else if (!small) {
        $("stage-say").textContent = "There is no picture of this file. Open it to see it.";
        $("stage-say").hidden = false;
      }
    } catch (error) {
      if (turn !== lookTurn) return;
      $("stage-say").textContent = `The picture could not be read: ${error.message}`;
      $("stage-say").hidden = false;
    } finally {
      if (turn === lookTurn) $("stage").classList.remove("drawing");
    }
  };
  const openLooked = async () => {
    const entry = shown[looking];
    if (!entry) return;
    try {
      await request("ui/open-link", { url: viewUrl(at.repository.id, at.branch, pathOf(entry.name)) });
    } catch (error) {
      $("stage-say").textContent = `This file could not be opened: ${error.message}`;
      $("stage-say").hidden = false;
    }
  };

  const start = async () => {
    $("search").addEventListener("input", () => { if (at.repository) chips(); draw(); });
    $("again").addEventListener("click", () => go(at));
    $("close").addEventListener("click", () => $("look").close());
    $("open").addEventListener("click", openLooked);
    $("previous").addEventListener("click", () => look(looking - 1));
    $("next").addEventListener("click", () => look(looking + 1));
    $("look").addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" && looking > 0) look(looking - 1);
      if (event.key === "ArrowRight" && looking < shown.length - 1) look(looking + 1);
    });
    $("look").addEventListener("click", (event) => { if (event.target === $("look")) $("look").close(); });
    const showAs = (rows) => {
      $("grid").classList.toggle("rows", rows);
      $("as-rows").setAttribute("aria-pressed", String(rows));
      $("as-grid").setAttribute("aria-pressed", String(!rows));
    };
    $("as-grid").addEventListener("click", () => showAs(false));
    $("as-rows").addEventListener("click", () => showAs(true));
    try {
      const initialized = await request("ui/initialize", {
        protocolVersion: PROTOCOL,
        appInfo: { name: "Files", version: "1" },
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
      });
      applyContext(initialized && initialized.hostContext);
    } catch (error) {
      showProblem(`The gallery could not connect to its host: ${error.message}`);
      return;
    }
    notify("ui/notifications/initialized", {});
    new ResizeObserver(() => {
      notify("ui/notifications/size-changed", { height: document.documentElement.scrollHeight });
    }).observe(document.body);
    await go(at);
  };

  start();
})();
</script>
</body>
</html>
